<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}User Trust &amp; Reputation{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('dashboard') }}">
      <span class="brand-mark">◈</span> Trust&nbsp;&amp;&nbsp;Reputation
    </a>
    <nav>
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('api_leaderboard') }}">API</a>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    User Trust &amp; Reputation Module · reputation range 0–100 · new users start at 50
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
